plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
    id 'maven-publish'
}

group = 'net.atlantisservices'
version = '1.0.4'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'redis.clients:jedis:4.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Fixed bytecode target so the build works on any JDK 21+ (1.0.3 shipped Java 21 bytecode).
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'net.atlantisservices'
            artifactId = 'packetsender'
            version = project.version

            from components.java
        }
    }

    repositories {
        maven {
            url = uri("https://repository.atlantisservices.net/repository/api/")
            credentials {
                username = project.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
                password = project.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
            }
        }
    }
}